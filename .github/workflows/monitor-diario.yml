name: Monitor diario
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      alvo:
        description: "Alvo de teste em reais por pessoa (deixe vazio no uso normal)"
        required: false
        default: ""
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        destino: [MCO, FLL, MIA, TPA]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Rodar monitor ${{ matrix.destino }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALVO_TESTE: ${{ inputs.alvo }}
        run: |
          if [ -n "$ALVO_TESTE" ]; then
            node monitor.mjs --destino "${{ matrix.destino }}" --salvar --alertar --alvo "$ALVO_TESTE"
          else
            node monitor.mjs --destino "${{ matrix.destino }}" --salvar --alertar
          fi
  resumo:
    needs: monitor
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Enviar resumo do dia
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node resumo-diario.mjs